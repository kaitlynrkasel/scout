# Weekly dependency update PRs, including security advisories. Keep an eye on
# xlsx (SheetJS) in particular, it has had prototype-pollution CVEs.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
