<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 340px; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F5F2EB; color: #241C13; }
  .head { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; }
  .head img { width: 26px; height: 26px; }
  .head b { font-size: 15px; }
  .sub { padding: 0 16px 10px; font-size: 12px; color: #57503f; }
  .cta { display: block; margin: 0 16px 12px; padding: 11px 0; width: calc(100% - 32px); background: #241C13; color: #F5F2EB; font-weight: 700; font-size: 14px; border: 0; border-radius: 10px; cursor: pointer; }
  .cta:hover { opacity: .92; }
  .warn { margin: 0 16px 12px; padding: 10px 12px; background: #fff; border: 1px solid #DED6C7; border-radius: 10px; font-size: 12px; color: #57503f; }
  .sec { padding: 0 16px 6px; }
  .sec .k { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: #8a7f6a; margin: 8px 0 6px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 1px solid #DED6C7; border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
  .row .t { min-width: 0; }
  .row .t b { display: block; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t span { display: block; font-size: 11px; color: #8a7f6a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row button { flex-shrink: 0; border: 1px solid #DED6C7; background: #F5F2EB; color: #241C13; font-size: 11px; font-weight: 700; padding: 5px 10px; border-radius: 8px; cursor: pointer; }
  .row button:hover { background: #EDE7DA; }
  .foot { padding: 8px 16px 14px; font-size: 11px; color: #8a7f6a; }
  a { color: #8A5A34; }
</style>
</head>
<body>
  <div class="head"><img src="icon128.png" alt=""><b>Scout Application Filler</b></div>
  <div class="sub" id="status">Checking your profile...</div>
  <button class="cta" id="fill">Fill this page</button>
  <div class="warn" id="warn" hidden>Open <a href="https://scout-source.com/app" target="_blank">scout-source.com</a> once while signed in so the extension can read your profile.</div>
  <div class="sec" id="copies"></div>
  <div class="foot">Fills only empty fields, highlights everything it touched, and never submits. Edit your details on Scout's Profile page.</div>
  <script src="popup.js"></script>
</body>
</html>
